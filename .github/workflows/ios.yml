name: VieLens iPhone
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device:
    name: Build and verify unsigned iPhone IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned sky segmentation model
        run: bash scripts/fetch-sky-model.sh
      - name: Generate Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Build for iPhone
        run: |
          set -euo pipefail
          xcodebuild -project VieLens.xcodeproj -scheme VieLens -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verify bundle and package IPA
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/VieLens.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")" = com.nguyendp911.smartvideo
          test "$(/usr/libexec/PlistBuddy -c 'Print DTPlatformName' "$APP/Info.plist")" = iphoneos
          lipo "$APP/VieLens" -verify_arch arm64
          test -d "$APP/SkySegSmall.mlmodelc"
          test ! -e "$APP/embedded.mobileprovision"
          test ! -e "$APP/_CodeSignature"
          if codesign -d "$APP/VieLens" >/dev/null 2>&1; then codesign --remove-signature "$APP/VieLens"; fi
          if codesign -d "$APP/VieLens" >/dev/null 2>&1; then exit 1; fi
          mkdir Payload
          ditto "$APP" Payload/VieLens.app
          zip -qyr VieLens-unsigned.ipa Payload
          unzip -tq VieLens-unsigned.ipa
          shasum -a 256 VieLens-unsigned.ipa | tee VieLens-unsigned.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: VieLens-iPhone-Unsigned
          path: |
            VieLens-unsigned.ipa
            VieLens-unsigned.sha256
          if-no-files-found: error
          retention-days: 30
  tests:
    name: Photo and Timeline tests
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned sky segmentation model
        run: bash scripts/fetch-sky-model.sh
      - name: Generate and test
        run: |
          set -euo pipefail
          command -v xcodegen || brew install xcodegen
          xcodegen generate
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys;ds=json.load(sys.stdin)["devices"];print(next(d["udid"] for devices in ds.values() for d in devices if d["name"].startswith("iPhone") and d["isAvailable"]))')
          xcodebuild -project VieLens.xcodeproj -scheme VieLens -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
