name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  simulator:
    name: Build for iOS Simulator
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate optional Python video downloader
        run: python3 -m py_compile backend/video_resolver/main.py

      - name: Validate nonlinear retime math
        run: |
          swiftc -swift-version 5 SmartVideo/Models/SpeedCurve.swift scripts/speed-curve-tests.swift -o /tmp/speed-curve-tests
          /tmp/speed-curve-tests

      - name: Prepare ViePN app icon
        run: bash scripts/make-icon.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile SwiftUI app
        run: |
          xcodebuild \
            -project SmartVideo.xcodeproj \
            -scheme SmartVideo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app for inspection
        if: success()
        run: |
          cd build/DerivedData/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/SmartVideo-Simulator.zip" SmartVideo.app

      - name: Upload simulator build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartVideo-Simulator
          path: SmartVideo-Simulator.zip
          retention-days: 7

  device_ipa:
    name: Build iPhone IPA (unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare ViePN app icon
        run: bash scripts/make-icon.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile for physical iPhone
        run: |
          xcodebuild \
            -project SmartVideo.xcodeproj \
            -scheme SmartVideo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceDerived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/DeviceDerived/Build/Products/Release-iphoneos/SmartVideo.app"
          test -d "$APP"
          test -f "$APP/SmartVideo"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ViePN-Smart-Video-unsigned.ipa Payload
          unzip -t ViePN-Smart-Video-unsigned.ipa | tail -n 1

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ViePN-Smart-Video-iPhone-Unsigned-IPA
          path: ViePN-Smart-Video-unsigned.ipa
          retention-days: 14
