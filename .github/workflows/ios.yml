name: iOS Build

# New commits supersede old PR runs; keep the newest build only.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  simulator:
    name: Build for iOS Simulator
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate optional Python video downloader
        run: python3 -m py_compile backend/video_resolver/main.py

      - name: Validate nonlinear retime math
        run: |
          swiftc -swift-version 5 SmartVideo/Models/SpeedCurve.swift scripts/speed-curve-tests.swift -o /tmp/speed-curve-tests
          /tmp/speed-curve-tests

      - name: Validate continuous project preview timing
        run: |
          swiftc -swift-version 5 SmartVideo/Models/ProjectPreviewTiming.swift scripts/project-preview-tests.swift -o /tmp/project-preview-tests
          /tmp/project-preview-tests

      - name: Validate live audio timing and envelopes
        run: |
          swiftc -swift-version 5 SmartVideo/Models/LiveAudioPreviewMath.swift scripts/live-audio-preview-tests.swift -o /tmp/live-audio-tests
          /tmp/live-audio-tests

      - name: Validate per-clip audio envelopes
        run: |
          swiftc -swift-version 5 SmartVideo/Models/ClipAudioEnvelope.swift scripts/clip-audio-envelope-tests.swift -o /tmp/clip-audio-tests
          /tmp/clip-audio-tests

      - name: Validate SFX audio keyframes and project compatibility
        run: |
          swiftc -swift-version 5 SmartVideo/Models/AudioGainKeyframe.swift SmartVideo/Models/SoundEffectClip.swift scripts/audio-automation-tests.swift -o /tmp/audio-automation-tests
          /tmp/audio-automation-tests

      - name: Validate shared audio-video timeline drag geometry
        run: |
          swiftc -swift-version 5 SmartVideo/Models/AudioGainKeyframe.swift SmartVideo/Models/AudioTimelineMath.swift scripts/multitrack-audio-tests.swift -o /tmp/multitrack-audio-tests
          /tmp/multitrack-audio-tests

      - name: Validate movable music and narration gain automation
        run: |
          swiftc -swift-version 5 SmartVideo/Models/AudioGainKeyframe.swift SmartVideo/Models/ProjectAudioTrackMath.swift scripts/project-audio-track-tests.swift -o /tmp/project-audio-track-tests
          /tmp/project-audio-track-tests

      - name: Validate independent multi-music editing
        run: |
          swiftc -swift-version 5 SmartVideo/Models/AudioGainKeyframe.swift SmartVideo/Models/SoundEffectClip.swift SmartVideo/Models/AudioTimelineMath.swift SmartVideo/Models/MusicRegionEditMath.swift scripts/multi-music-region-tests.swift -o /tmp/multi-music-region-tests
          /tmp/multi-music-region-tests

      - name: Validate Text Layer Pro project compatibility and presets
        run: |
          swiftc -swift-version 5 SmartVideo/Models/TextOverlayClip.swift SmartVideo/Models/TextTitlePreset.swift scripts/text-title-pro-tests.swift -o /tmp/text-title-pro-tests
          /tmp/text-title-pro-tests

      - name: Prepare ViePN app icon
        run: bash scripts/make-icon.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile SwiftUI app
        run: |
          xcodebuild \
            -project SmartVideo.xcodeproj \
            -scheme SmartVideo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify visible text pixels and exported MP4 on Simulator
        timeout-minutes: 6
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; uuids=[d["udid"] for ds in data.values() for d in ds if d["state"] in ("Shutdown","Booted") and d["name"].startswith("iPhone") and d.get("isAvailable",True)]; print(uuids[0] if uuids else "")')
          test -n "$DEVICE"
          echo "Using iOS Simulator: $DEVICE"
          xcodebuild \
            -project SmartVideo.xcodeproj \
            -scheme SmartVideo \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -destination-timeout 60 \
            -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:SmartVideoTests/TextExportSmokeTests \
            test

      - name: Package simulator app for inspection
        if: success()
        run: |
          cd build/DerivedData/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/SmartVideo-Simulator.zip" SmartVideo.app

      - name: Upload simulator build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartVideo-Simulator
          path: SmartVideo-Simulator.zip
          retention-days: 7

  device_ipa:
    name: Build iPhone IPA (unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare ViePN app icon
        run: bash scripts/make-icon.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile for physical iPhone
        run: |
          xcodebuild \
            -project SmartVideo.xcodeproj \
            -scheme SmartVideo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceDerived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/DeviceDerived/Build/Products/Release-iphoneos/SmartVideo.app"
          test -d "$APP"
          test -f "$APP/SmartVideo"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ViePN-Smart-Video-unsigned.ipa Payload
          unzip -t ViePN-Smart-Video-unsigned.ipa | tail -n 1

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ViePN-Smart-Video-iPhone-Unsigned-IPA
          path: ViePN-Smart-Video-unsigned.ipa
          retention-days: 14
