name: VieLens
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  VieLens:
    platform: iOS
    type: application
    sources: [App, Camera, Imaging, Library, Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nguyendp911.smartvideo
        MARKETING_VERSION: "14.0.0"
        CURRENT_PROJECT_VERSION: "59"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: VieLens
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSFaceIDUsageDescription: "VieLens xác thực để mở bản sao ảnh mã hóa."
        NSMicrophoneUsageDescription: "VieLens dùng microphone khi bạn chủ động thu âm lời kể cho story."
        NSCameraUsageDescription: "VieLens dùng camera để chụp ảnh trên iPhone."
        NSPhotoLibraryAddUsageDescription: "Lưu ảnh bạn chọn từ Timeline vào ứng dụng Ảnh."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  VieLensTests:
    platform: iOS
    type: bundle.unit-test
    sources: [Tests]
    dependencies:
      - target: VieLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nguyendp911.smartvideo.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VieLens:
    build:
      targets:
        VieLens: all
    test:
      targets: [VieLensTests]
