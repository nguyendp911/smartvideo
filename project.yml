name: SmartVideo
options:
  bundleIdPrefix: com.nguyendp911
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  SmartVideo:
    type: application
    platform: iOS
    sources:
      - path: SmartVideo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nguyendp911.smartvideo
        MARKETING_VERSION: "6.0.0"
        CURRENT_PROJECT_VERSION: "47"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: SmartVideo/Info.plist
      properties:
        CFBundleDisplayName: ViePN Smart Video
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleName: ViePNSmartVideo
        UILaunchStoryboardName: LaunchScreen
        LSRequiresIPhoneOS: true
        NSMicrophoneUsageDescription: "SmartVideo cần quyền dùng micro để ghi thuyết minh."
        NSSpeechRecognitionUsageDescription: "ViePN Smart Video sử dụng nhận diện giọng nói để tạo phụ đề từ tệp âm thanh và video mà bạn chọn. Mặc định xử lý trên iPhone; chỉ dùng dịch vụ Apple khi bạn chủ động cho phép."
        NSPhotoLibraryAddUsageDescription: "SmartVideo cần quyền thêm video đã xuất vào thư viện Ảnh."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
  SmartVideoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SmartVideoTests
    dependencies:
      - target: SmartVideo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nguyendp911.smartvideo.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SmartVideo.app/SmartVideo"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SmartVideo:
    build:
      targets:
        SmartVideo: all
    test:
      targets:
        - SmartVideoTests
    run:
      config: Debug
    archive:
      config: Release
